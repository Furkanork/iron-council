let moodOk = 0, topicOk = 0, intentOk = 0, intentN = 0, allOk = 0;
let aboutOk = 0, aboutN = 0, guardOk = 0, guardN = 0;
for (const [text, mood, topic, intent] of CASES) {
  const m = Engine.detectMood(text), t = Engine.detectTopic(text), i = Engine.detectIntent(text);
  const ab = Engine.detectAbout(text, "mehmed");
  const general = ab && ab.kind === "about" && ab.subject === "general";
  const effAb = ab && !(general && (m !== "general" || t || i)) ? ab.kind + ":" + (ab.subject || ab.target) : null;
  const isAbout = intent && /^(about|opinion):/.test(intent);
  let mGood = true, tGood = true, iGood = true;
  if (isAbout) { iGood = effAb === intent; aboutN++; aboutOk += iGood; }
  else if (intent) { iGood = !effAb && i === intent; intentN++; intentOk += iGood; }
  else { mGood = m === mood; tGood = t === topic; iGood = !effAb; moodOk += mGood; topicOk += tGood; if (/you|sen|mısın|musun|korkuyorum/i.test(text)) { guardN++; guardOk += mGood && tGood && iGood; } }
  const good = mGood && tGood && iGood; allOk += good;
  const exp = intent ? intent : `${mood} / ${topic || "—"}`;
  const got = isAbout || effAb ? (effAb || "—") : intent ? (i || "—") : `${m} / ${t || "—"}`;
  body.insertAdjacentHTML("beforeend", `<tr><td>${text}</td><td>${exp}</td><td class="${good ? "ok" : "bad"}">${got}</td><td class="${good ? "ok" : "bad"}">${good ? "✓" : "✗"}</td></tr>`);
}
const n = CASES.length - intentN - aboutN;

const pct = (a, b) => Math.round((a / b) * 100) + "%";
document.getElementById("stats").innerHTML = [
  [pct(allOk, CASES.length), `fully correct (${allOk}/${CASES.length})`],
  [pct(moodOk, n), "feeling read correctly"],
  [pct(topicOk, n), "topic read correctly"],
  [pct(intentOk, intentN), "greeting / thanks / who"],
  [pct(aboutOk, aboutN), `questions about him (${aboutOk}/${aboutN})`],
  [pct(guardOk, guardN), `"you" messages kept as yours (${guardOk}/${guardN})`],
  [lines.reduce((a, b) => a + b, 0), `lines total (${Math.min(...lines)}–${Math.max(...lines)} each)`],
  [seen.size, "different answers / 2000 asks"],
  [ms.toFixed(2) + " ms", "to build one answer"]
].map(([b, s]) => `<div class="stat"><b>${b}</b><span>${s}</span></div>`).join("");
window.EVAL = { aboutOk, aboutN, guardOk, guardN, allOk, total: CASES.length, moodOk, topicOk, n, intentOk, intentN, lines, variety: seen.size, ms,
  misses: [...body.querySelectorAll("tr")].filter((r) => r.querySelector(".bad")).map((r) => r.innerText.replace(/\t/g, " | ")) };
</script>
